<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 400">
  <defs>
    <linearGradient id="vane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe15a"/>
      <stop offset=".45" stop-color="#f2b31c"/>
      <stop offset="1" stop-color="#c96a08"/>
    </linearGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3cf7a"/>
      <stop offset="1" stop-color="#9a5a18"/>
