[project]
name = "mixai-backend"
version = "0.1.0"
description = "Mix AI Cinema Studio API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "imageio-ffmpeg>=0.5",
    "websockets>=12",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "anyio>=4.4",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
